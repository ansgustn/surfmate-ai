services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: surf
      POSTGRES_PASSWORD: surf
      POSTGRES_DB: surf
    ports:
      - "5432:5432"
    volumes:
      - ./db/init:/docker-entrypoint-initdb.d:ro
      - dbdata:/var/lib/postgresql/data

volumes:
  dbdata:
